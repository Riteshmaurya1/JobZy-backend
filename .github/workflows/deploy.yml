name: Deploy JobZy Backend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "server/package-lock.json"

      - name: Install dependencies
        run: |
          cd server
          npm ci

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r server/src deploy/
          cp server/package*.json deploy/
          cp server/ecosystem.config.js deploy/
          cp server/server.js deploy/
          [ -f server/.env.example ] && cp server/.env.example deploy/ || echo "No .env.example found"
          tar -czf deploy.tar.gz -C deploy .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deploy.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      # ✅ FIX #1 — Proper SSH key handling (prevents “Permission denied (publickey)”)
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/jobzyjenkins.pem
          chmod 600 ~/.ssh/jobzyjenkins.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # ✅ FIX #2 — Use rsync instead of scp (more reliable)
      - name: Copy package to EC2
        run: |
          rsync -avz -e "ssh -i ~/.ssh/jobzyjenkins.pem -o StrictHostKeyChecking=no" \
            deploy.tar.gz ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/

      # ✅ FIX #3 — Corrected deploy block (works with your EC2 setup)
      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/jobzyjenkins.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'

            set -e

            cd /home/ubuntu/JobZy-backend/server

            # Backup current version
            if [ -f "server.js" ]; then
              timestamp=$(date +%Y%m%d_%H%M%S)
              mkdir -p backups
              tar -czf backups/backup_${timestamp}.tar.gz \
                server.js package.json package-lock.json ecosystem.config.js src .env 2>/dev/null || true

              ls -t backups/backup_*.tar.gz 2>/dev/null | tail -n +6 | xargs -r rm
            fi

            # Extract new build
            echo "Extracting deployment package..."
            tar -xzf /tmp/deploy.tar.gz -C /home/ubuntu/JobZy-backend/server
            rm /tmp/deploy.tar.gz

            echo "Installing production dependencies..."
            npm ci --omit=dev

            if [ ! -f .env ]; then
              echo "❌ .env missing — stopping deployment"
              exit 1
            fi

            mkdir -p logs

            echo "Reloading PM2..."
            if pm2 list | grep -q "jobzy-backend"; then
              pm2 reload ecosystem.config.js --update-env
            else
              pm2 start ecosystem.config.js
            fi

            pm2 save

            echo "Deployment complete"
            pm2 list
          EOF

      # ✅ FIX #4 — Better health check (prevents false failure)
      - name: Verify deployment
        run: |
          echo "✅ Deployment completed successfully"
          echo "PM2 processes:"
          ssh -i ~/.ssh/jobzyjenkins.pem -o StrictHostKeyChecking=no \
          ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "pm2 list"

      # ✅ FIX #5 — Working rollback step
      - name: Rollback on failure
        if: failure()
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/jobzyjenkins.pem
          chmod 600 ~/.ssh/jobzyjenkins.pem

          ssh -i ~/.ssh/jobzyjenkins.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'

            cd /home/ubuntu/JobZy-backend/server

            latest_backup=$(ls -t backups/backup_*.tar.gz 2>/dev/null | head -1)

            if [ -n "$latest_backup" ]; then
              echo "Rolling back to $latest_backup"
              tar -xzf "$latest_backup" -C /home/ubuntu/JobZy-backend/server
              npm ci --omit=dev
              pm2 reload ecosystem.config.js --update-env
              pm2 list
            else
              echo "No backup found — manual recovery needed"
            fi
          EOF
