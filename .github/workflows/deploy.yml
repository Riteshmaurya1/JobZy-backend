name: Deploy JobZy Backend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: # manual trigger
  
permissions:
  contents: read

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "server/package-lock.json"

      - name: Install dependencies
        run: |
          cd server
          npm ci

      - name: Verify installation
        run: |
          cd server
          npm list --depth=0

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r server/src deploy/
          cp server/package*.json deploy/
          cp server/ecosystem.config.js deploy/
          cp server/server.js deploy/
          # Copy .env.example if exists
          [ -f server/.env.example ] && cp server/.env.example deploy/ || echo "No .env.example found"
          tar -czf deploy.tar.gz -C deploy .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deploy.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Deploy to EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          # Create SSH key file
          echo "$SSH_PRIVATE_KEY" > jobzybackend.pem
          chmod 600 jobzybackend.pem

          # Copy deployment package to EC2
          scp -i jobzybackend.pem -o StrictHostKeyChecking=no \
            deploy.tar.gz ${EC2_USERNAME}@${EC2_HOST}:/tmp/

          # SSH into EC2 and deploy
          ssh -i jobzybackend.pem -o StrictHostKeyChecking=no \
            ${EC2_USERNAME}@${EC2_HOST} << 'EOF'
            
            set -e  # Exit on error
            
            # Navigate to app directory
            cd /home/ubuntu/JobZy-backend/server

            # Backup current version
            if [ -f "server.js" ]; then
              timestamp=$(date +%Y%m%d_%H%M%S)
              mkdir -p backups
              echo "Creating backup: backup_${timestamp}.tar.gz"
              tar -czf backups/backup_${timestamp}.tar.gz \
                server.js package.json package-lock.json ecosystem.config.js src .env 2>/dev/null || true
              
              # Keep only last 5 backups
              ls -t backups/backup_*.tar.gz 2>/dev/null | tail -n +6 | xargs -r rm
            fi

            # Extract new version
            echo "Extracting deployment package..."
            tar -xzf /tmp/deploy.tar.gz -C /home/ubuntu/JobZy-backend/server
            rm /tmp/deploy.tar.gz

            # Install production dependencies
            echo "Installing production dependencies..."
            npm ci --omit=dev

            # Ensure .env exists (warn if missing)
            if [ ! -f .env ]; then
              echo "⚠️  WARNING: .env file not found!"
              echo "Please create .env file with production variables"
              exit 1
            fi

            # Create logs directory
            mkdir -p logs

            # Reload PM2 with zero-downtime (for both apps)
            echo "Reloading PM2 applications..."
            if pm2 list | grep -q "jobzy-backend"; then
              echo "Zero-downtime reload..."
              pm2 reload ecosystem.config.js --update-env
            else
              echo "Starting PM2 for the first time..."
              pm2 start ecosystem.config.js
            fi

            # Save PM2 process list
            pm2 save

            # Wait for app to be ready
            echo "Waiting for application to start..."
            sleep 10

            # Display PM2 status
            echo ""
            echo "✅ Deployment complete!"
            echo "Current PM2 Status:"
            pm2 list
            
            # Show recent logs
            echo ""
            echo "Recent logs:"
            pm2 logs --lines 10 --nostream
            
          EOF

          # Cleanup
          rm jobzybackend.pem

      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "Verifying deployment..."
          sleep 15

          # Try health check endpoint
          for i in {1..5}; do
            echo "Health check attempt $i of 5..."
            
            # Try /health endpoint
            response=$(curl -s -o /dev/null -w "%{http_code}" http://${EC2_HOST}/health 2>/dev/null || echo "000")
            
            if [ "$response" = "200" ]; then
              echo "✅ Deployment successful! Health check passed with status: $response"
              exit 0
            fi
            
            # Try /api/health endpoint
            response=$(curl -s -o /dev/null -w "%{http_code}" http://${EC2_HOST}/api/health 2>/dev/null || echo "000")
            
            if [ "$response" = "200" ]; then
              echo "✅ Deployment successful! API health check passed with status: $response"
              exit 0
            fi
            
            # Try root endpoint as fallback
            response=$(curl -s -o /dev/null -w "%{http_code}" http://${EC2_HOST}/ 2>/dev/null || echo "000")
            
            if [ "$response" = "200" ] || [ "$response" = "301" ] || [ "$response" = "302" ]; then
              echo "✅ Deployment successful! Root endpoint responding with status: $response"
              exit 0
            fi
            
            echo "Got response: $response, waiting 10 seconds before retry..."
            sleep 10
          done

          echo "❌ Deployment verification failed after 5 attempts"
          echo "Please check PM2 logs on the server:"
          echo "  ssh into EC2 and run: pm2 logs"
          exit 1

      - name: Rollback on failure
        if: failure()
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "⚠️  Deployment failed! Attempting rollback..."

          echo "$SSH_PRIVATE_KEY" > jobzybackend.pem
          chmod 600 jobzybackend.pem

          ssh -i jobzybackend.pem -o StrictHostKeyChecking=no \
            ${EC2_USERNAME}@${EC2_HOST} << 'EOF'
            
            cd /home/ubuntu/JobZy-backend/server

            # Find latest backup
            latest_backup=$(ls -t backups/backup_*.tar.gz 2>/dev/null | head -1)

            if [ -n "$latest_backup" ]; then
              echo "Found backup: $latest_backup"
              echo "Rolling back..."
              
              # Extract backup
              tar -xzf "$latest_backup" -C /home/ubuntu/JobZy-backend/server
              
              # Reinstall dependencies
              npm ci --omit=dev
              
              # Reload PM2
              pm2 reload ecosystem.config.js --update-env
              
              echo "✅ Rolled back to previous version"
              pm2 list
            else
              echo "❌ No backup found, cannot rollback"
              echo "Manual intervention required!"
            fi
          EOF

          rm jobzybackend.pem

          echo "Rollback completed. Please verify manually."
