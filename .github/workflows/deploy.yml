name: Deploy JobZy Backend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: # manual trigger

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "server/package-lock.json"

      - name: Install dependencies
        run: |
          cd server
          npm ci

      - name: Verify installation
        run: |
          cd server
          npm list --depth=0

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r server/src deploy/
          cp server/package*.json deploy/
          cp server/ecosystem.config.js deploy/
          cp server/server.js deploy/
          # Copy .env.example if exists
          [ -f server/.env.example ] && cp server/.env.example deploy/ || echo "No .env.example found"
          tar -czf deploy.tar.gz -C deploy .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deploy.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Deploy to EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          # Create SSH key file
          echo "$SSH_PRIVATE_KEY" > jobzybackend.pem
          chmod 600 jobzybackend.pem

          # Copy deployment package to EC2
          scp -i jobzybackend.pem -o StrictHostKeyChecking=no \
            deploy.tar.gz ${EC2_USERNAME}@${EC2_HOST}:/tmp/

          # SSH into EC2 and deploy
          ssh -i jobzybackend.pem -o StrictHostKeyChecking=no \
            ${EC2_USERNAME}@${EC2_HOST} << 'EOF'
            
            # Navigate to app directory
            cd /home/ubuntu/JobZy-backend/server

            # Fix ownership first (important!)
            echo "Fixing directory ownership..."
            sudo chown -R $USER:$USER /home/ubuntu/JobZy-backend

            # Backup current version
            if [ -f "server.js" ]; then
              timestamp=$(date +%Y%m%d_%H%M%S)
              mkdir -p backups
              tar -czf backups/backup_${timestamp}.tar.gz server.js package.json ecosystem.config.js src .env 2>/dev/null || true
              # Keep only last 5 backups
              ls -t backups/backup_*.tar.gz 2>/dev/null | tail -n +6 | xargs -r rm
            fi

            # Extract new version (this will overwrite existing files)
            echo "Extracting new deployment package..."
            tar --overwrite -xzf /tmp/deploy.tar.gz -C /home/ubuntu/JobZy-backend/server
            rm /tmp/deploy.tar.gz

            # Fix ownership after extraction
            sudo chown -R $USER:$USER /home/ubuntu/JobZy-backend

            # Install production dependencies on the server
            echo ""
            echo "Installing production dependencies..."
            npm ci --omit=dev

            # Create .env file if needed (only on first deploy)
            if [ ! -f .env ]; then
              echo "Creating default .env file..."
              echo "NODE_ENV=production" > .env
              echo "PORT=3000" >> .env
              echo "Please update .env with actual values!"
            fi

            # Create logs directory
            mkdir -p logs

            # Stop cron worker first (to avoid conflicts)
            if pm2 describe jobzy-cron-worker > /dev/null 2>&1; then
              echo "Stopping cron worker..."
              sudo pm2 stop jobzy-cron-worker
            fi

            # Zero-downtime reload with PM2 for main app
            if pm2 describe jobzy-backend > /dev/null 2>&1; then
              echo "Reloading PM2 app (zero-downtime)..."
              sudo pm2 reload ecosystem.config.js --only jobzy-backend --update-env
            else
              echo "Starting new PM2 process..."
              sudo pm2 start ecosystem.config.js --only jobzy-backend
            fi

            # Restart cron worker
            if pm2 describe jobzy-cron-worker > /dev/null 2>&1; then
              echo "Starting cron worker..."
              sudo pm2 restart jobzy-cron-worker
            else
              sudo pm2 start ecosystem.config.js --only jobzy-cron-worker
            fi

            # Save PM2 process list
            sudo pm2 save

            # Display PM2 status
            echo ""
            echo "Current PM2 Status:"
            sudo pm2 list
            
          EOF

          # Cleanup
          rm jobzybackend.pem

      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "Waiting for application to start..."
          sleep 15

          # Check if app responds via nginx (try multiple times)
          for i in {1..3}; do
            echo "Attempt $i of 3..."
            response=$(curl -s -o /dev/null -w "%{http_code}" http://${EC2_HOST}/health 2>/dev/null || echo "000")
            
            if [ "$response" = "200" ]; then
              echo "Deployment successful! App is responding with status: $response"
              exit 0
            fi
            
            # Try root endpoint if /health doesn't exist
            if [ "$response" = "404" ]; then
              response=$(curl -s -o /dev/null -w "%{http_code}" http://${EC2_HOST}/ 2>/dev/null || echo "000")
              if [ "$response" = "200" ] || [ "$response" = "301" ] || [ "$response" = "302" ]; then
                echo "Deployment successful! App is responding with status: $response"
                exit 0
              fi
            fi
            
            echo "Got response: $response, waiting 5 seconds..."
            sleep 5
          done

          echo "Deployment verification failed after 3 attempts"
          echo "Please check PM2 logs on the server: sudo pm2 logs jobzy-backend"
          exit 1

      - name: Rollback on failure
        if: failure()
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "Attempting to rollback to previous version..."

          echo "$SSH_PRIVATE_KEY" > jobzybackend.pem
          chmod 600 jobzybackend.pem

          ssh -i jobzybackend.pem -o StrictHostKeyChecking=no \
            ${EC2_USERNAME}@${EC2_HOST} << 'EOF'
            
            cd /home/ubuntu/JobZy-backend/server

            # Fix ownership first (important!)
            sudo chown -R $USER:$USER /home/ubuntu/JobZy-backend

            # Find latest backup
            latest_backup=$(ls -t backups/backup_*.tar.gz 2>/dev/null | head -1)

            if [ -n "$latest_backup" ]; then
              echo "Found backup: $latest_backup"
              tar -xzf "$latest_backup" -C /home/ubuntu/JobZy-backend/server
              npm ci --omit=dev
              sudo pm2 reload ecosystem.config.js --update-env
              echo "Rolled back to previous version"
            else
              echo "No backup found, cannot rollback"
            fi
          EOF

          rm jobzybackend.pem